databaseChangeLog:
  - changeSet:
      id: 003-create-refresh-token-table
      author: areeba
      changes:
        - createTable:
            tableName: refresh_token
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_refresh_token
                    nullable: false

              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_refresh_token_token

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_refresh_token_user

              - column:
                  name: expiry_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: refresh_token
            baseColumnNames: user_id
            constraintName: fk_refresh_token_account
            referencedTableName: account
            referencedColumnNames: user_id
            onDelete: CASCADE