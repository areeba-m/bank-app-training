databaseChangeLog:

  - changeSet:
      id: create-balance-table
      author: simal

      changes:

        - createTable:
            tableName: balance
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: indicator
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false


        - addForeignKeyConstraint:
            baseTableName: balance
            baseColumnNames: user_id
            referencedTableName: account
            referencedColumnNames: user_id
            constraintName: fk_balance_account