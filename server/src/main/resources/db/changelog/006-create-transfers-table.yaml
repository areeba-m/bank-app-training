databaseChangeLog:
  - changeSet:
      id: create-transfers-table
      author: mashhood

      changes:
        - createTable:
            tableName: transfers
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: sender_account_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: receiver_account_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: idempotency_key
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: transfers
            columnNames: sender_account_id, idempotency_key
            constraintName: uk_transfer_sender_idempotency

        - addForeignKeyConstraint:
            baseTableName: transfers
            baseColumnNames: sender_account_id
            referencedTableName: account
            referencedColumnNames: user_id
            constraintName: fk_transfer_sender_account

        - addForeignKeyConstraint:
            baseTableName: transfers
            baseColumnNames: receiver_account_id
            referencedTableName: account
            referencedColumnNames: user_id
            constraintName: fk_transfer_receiver_account
