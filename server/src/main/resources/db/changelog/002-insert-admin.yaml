databaseChangeLog:
  - changeSet:
      id: insert-admin
      author: mashhood

      changes:
        - insert:
            tableName: account
            columns:
              - column:
                  name: name
                  value: Admin

              - column:
                  name: email
                  value: admin@bank.com

              - column:
                  name: password
                  value: admin

              - column:
                  name: address
                  value: Bank Head Office

              - column:
                  name: role
                  value: ADMIN

              - column:
                  name: created_at
                  valueComputed: CURRENT_TIMESTAMP

              - column:
                  name: updated_at
                  valueComputed: CURRENT_TIMESTAMP