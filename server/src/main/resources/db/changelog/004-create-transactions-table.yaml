databaseChangeLog:
  - changeSet:
      id: create-transactions-table
      author: simal-areeba

      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: indicator
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: counterparty_account_id
                  type: BIGINT

              - column:
                  name: counterparty_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: true

              - column:
                  name: counterparty_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: true

              - column:
                  name: transfer_id
                  type: BIGINT
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: account_id
            referencedTableName: account
            referencedColumnNames: user_id
            constraintName: fk_transaction_account

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: counterparty_account_id
            referencedTableName: account
            referencedColumnNames: user_id
            constraintName: fk_transaction_counterparty_account

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: transfer_id
            referencedTableName: transfers
            referencedColumnNames: id
            constraintName: fk_transaction_transfer