spring:
  application:
    name: ${APPLICATION_NAME}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT}
          timeout: ${MAIL_SMTP_TIMEOUT}
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_CHAT_MODEL}

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoint:
    health:
      show-details: when-authorized
      roles: "admin"
  endpoints:
    web:
      exposure:
        include: "health"
        exclude: "*"

## custom configurations
app:
  otp:
    length: 6
    expiry-days: 7
    max-attempts: 5
    resend-cooldown-seconds: 60
  jwt:
    password-reset-token-expiry-minutes: 10
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

categorization:
  llm:
    enabled: ${CATEGORIZATION_LLM_ENABLED:true}
    api-key: ${GEMINI_API_KEY}
    model: ${CATEGORIZATION_LLM_MODEL:gemini-3.6-flash}
    timeout-millis: ${CATEGORIZATION_LLM_TIMEOUT_MS:5000}

bootui:
  enabled: ON