spring:
  application:
    name: server
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.6-flash

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.google.genai: DEBUG
    okhttp3: INFO
    com.redmath.categorization.client.GeminiLlmClient: DEBUG
    #    root: DEBUG
    #    com.redmath: INFO
    #    org.springframework.security: INFO
  file:
    path: logs

categorization:
  llm:
    enabled: ${CATEGORIZATION_LLM_ENABLED:true}
    api-key: ${GEMINI_API_KEY}
    model: ${CATEGORIZATION_LLM_MODEL:gemini-3.6-flash}
    timeout-millis: ${CATEGORIZATION_LLM_TIMEOUT_MS:5000}