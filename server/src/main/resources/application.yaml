spring:
  application:
    name: server
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

app:
  otp:
    length: 6
    expiry-minutes: 15
    max-attempts: 5
    resend-cooldown-seconds: 60
  jwt:
    password-reset-token-expiry-minutes: 10

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.google.genai: DEBUG
    okhttp3: INFO
    com.redmath.categorization.client.GeminiLlmClient: DEBUG
    #    root: DEBUG
    #    com.redmath: INFO
    #    org.springframework.security: INFO
  file:
    path: logs

categorization:
  llm:
    enabled: ${CATEGORIZATION_LLM_ENABLED:true}
    api-key: ${GEMINI_API_KEY}
    model: ${CATEGORIZATION_LLM_MODEL:gemini-3.6-flash}
    timeout-millis: ${CATEGORIZATION_LLM_TIMEOUT_MS:5000}