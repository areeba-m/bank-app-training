spring:
  application:
    name: server
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: DEBUG
    com.redmath: INFO
    org.springframework.security: INFO
#  file:
#    path: logs

categorization:
  llm:
    enabled: ${CATEGORIZATION_LLM_ENABLED:true}
    api-key: ${GEMINI_API_KEY}
    model: ${CATEGORIZATION_LLM_MODEL:gemini-3.6-flash}
    timeout-millis: ${CATEGORIZATION_LLM_TIMEOUT_MS:5000}