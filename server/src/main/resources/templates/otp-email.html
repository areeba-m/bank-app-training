<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Activate Your Account</title>
</head>
<body>
<h2>Hello, <span th:text="${name}">User</span>!</h2>

<p>
    Welcome! Please activate your account using the link below:
</p>

<p>
    <a th:href="${activationUrl}"
       style="
           display: inline-block;
           padding: 10px 18px;
           background-color: #2563eb;
           color: white;
           text-decoration: none;
           border-radius: 5px;
       ">
        Activate Account
    </a>
</p>

<p>
    Or use this one-time login code:
    <strong style="font-size: 18px; color: blue;" th:text="${otp}">
        000000
    </strong>
</p>

<p>
    This code will expire in
    <span th:text="${expiryDays}">10</span> days.
</p>

<p>
    If you did not request this email, you can safely ignore it.
</p>
</body>
</html>
